<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="A procedurally generated Nordic valley sandbox for WebXR.">
  <title>Openworld Sandbox</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🏔️</text></svg>">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.min.js",
        "three/": "./vendor/three/"
      }
    }
  </script>
</head>
<body>
  <div id="app"></div>

  <div id="overlay" class="overlay">
    <div class="panel compact-panel">
      <header>
        <p class="eyebrow">WEBXR SANDBOX</p>
        <h1>Openworld</h1>
        <p class="tagline">A blank northern valley for testing movement, vehicles, creatures and whatever other nonsense we throw into it.</p>
      </header>

      <div class="quality" id="quality-row" aria-label="Graphics quality">
        <span class="quality-label">Graphics</span>
        <button data-quality="low">Low</button>
        <button data-quality="medium">Medium</button>
        <button data-quality="high">High</button>
      </div>

      <div class="loading" id="loading">
        <div class="bar"><div class="fill" id="progress-fill"></div></div>
        <div class="status" id="progress-label">Preparing…</div>
      </div>

      <div class="actions" id="actions" hidden>
        <button id="enter-vr" class="primary" disabled>Checking for a headset…</button>
        <button id="enter-desktop" class="secondary">Explore on desktop</button>
      </div>

      <div class="controls compact-controls">
        <div class="control-group">
          <h2>VR controls</h2>
          <dl>
            <dt>Left stick</dt><dd>Move</dd>
            <dt>Left grip</dt><dd>Run</dd>
            <dt>Right stick</dt><dd>Smooth turn</dd>
            <dt>A</dt><dd>Jump</dd>
          </dl>
        </div>
      </div>

      <p class="desktop-hint">Desktop: W A S D + mouse · Shift to run · Space to jump</p>
      <p class="note" id="xr-note"></p>
    </div>
  </div>

  <div id="hud" class="hud" hidden>
    <div id="notice" class="notice"></div>
    <div id="stats" class="stats"></div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
